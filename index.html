<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technico Digital Solutions Inc. — branding, web development, and digital marketing for ambitious businesses."
    />
    <!-- Preloaded ahead of CSS parse: Bold drives Hero's largest
         headline (likely LCP element on most routes), Mono Regular
         is the default weight for the site's ~140 uppercase
         label/status readouts (see font-mono in src/index.css). -->
    <link
      rel="preload"
      href="/fonts/suisse/SuisseIntl-Bold.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/suisse/SuisseIntlMono-Regular.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <title>Technico Digital Solutions Inc.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
